name: Update AppSumo Docs

on:
  schedule:
    - cron: '0 0 * * 0'   # Every Sunday at midnight UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI
    inputs:
      force_publish:
        description: 'Publish current version to npm even if docs are unchanged (e.g. catch-up after a failed publish)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        run: npm run scrape

      - name: Check for doc changes
        id: diff
        run: |
          changed_files=$(git diff --name-only docs/)
          new_files=$(git ls-files --others --exclude-standard docs/)
          all_changed=$(printf "%s\n%s" "$changed_files" "$new_files" | grep -v '^$' || true)

          if [ -z "$all_changed" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No doc changes detected, skipping publish."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Doc changes detected:"
            echo "$all_changed" | while read -r file; do
              echo "  changed → $file"
            done
          fi

      - name: Configure git
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit docs and bump version
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add docs/
          git commit -m "chore: auto-update AppSumo docs [skip ci]"
          npm version patch --no-git-tag-version
          git add package.json
          git commit -m "chore: bump version [skip ci]"
          git push

      - name: Publish to npm
        if: steps.diff.outputs.changed == 'true' || github.event.inputs.force_publish == 'true'
        run: npm publish
